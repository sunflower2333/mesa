name: Windows D3D10 UMD on Zink (ARM64EC)

# Emulated x64 processes cannot load a native ARM64 user-mode driver. This
# builds an ARM64EC UMD, but compile success alone does not provide a working
# deployment: its Vulkan ICD/dependencies must also support x64/ARM64EC, and
# native/x64 selection needs a supported loader mechanism (such as ARM64X).
# UserModeDriverNameWoW selects a 32-bit UMD, not this x64-compatible image.
#
# Kept separate from the driver package build on purpose: ARM64EC is a new
# target for this tree and a failure here must not stop the ARM64 package.

on:
  workflow_dispatch:
  # workflow_dispatch cannot reach a workflow that is not on the default
  # branch, and this one is developed on a topic branch.
  push:
    branches:
      - 'wip/turnip-wddm-assumenotinuse'
    paths:
      - '.github/workflows/windows-d3d10-zink-arm64ec.yml'
      - 'bin/verify-arm64ec-pe.py'
      - 'src/util/detect_arch.h'
      - 'src/util/xxhash.h'
      - 'src/gallium/frontends/d3d10umd/**'
      - 'src/gallium/targets/d3d10umd/**'
      - 'src/freedreno/**'

jobs:
  arm64ec-umd:
    name: ARM64EC D3D10 UMD link (clang-cl, zink)
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC and WDK
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64_arm64

      - name: Install the WDK matching the selected SDK
        shell: pwsh
        run: |
          # d3d10umddi.h and d3dkmddi.h ship in the WDK, not the SDK.  They must
          # come from the same kit as every other Windows header: DXGK_FEATURE_ID
          # is declared in d3dukmdt.h on 10.0.26100.0 and in d3dkmddi.h on
          # 10.0.22000.0, so a build spanning two kits redefines it.  The runner
          # image carries a WDK-only 22000 kit that has no windows.h, so the fix
          # is to install the WDK for the SDK msvc-dev-cmd already selected and
          # leave INCLUDE alone.
          $sdkVersion = ($env:WindowsSDKVersion -replace '\\+$', '')
          if ([string]::IsNullOrWhiteSpace($sdkVersion)) {
            throw 'msvc-dev-cmd did not report a Windows SDK version'
          }
          $roots = @(
            'C:\Program Files (x86)\Windows Kits\10\Include',
            'C:\Program Files\Windows Kits\10\Include'
          ) | Where-Object { Test-Path $_ }

          function Test-KitComplete($version) {
            foreach ($root in $roots) {
              $kit = Join-Path $root $version
              if ((Test-Path (Join-Path $kit 'um\d3d10umddi.h')) -and
                  (Test-Path (Join-Path $kit 'shared\d3dkmddi.h')) -and
                  (Test-Path (Join-Path $kit 'um\windows.h'))) {
                return $kit
              }
            }
            return $null
          }

          $kit = Test-KitComplete $sdkVersion
          if ($null -eq $kit) {
            Write-Host "SDK $sdkVersion has no WDK headers; installing the WDK."
            $installer = Join-Path $env:RUNNER_TEMP 'wdksetup.exe'
            # fwlink 2272234 is the WDK for Windows 11, version 24H2 (10.0.26100).
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2272234' -OutFile $installer
            $proc = Start-Process -FilePath $installer -ArgumentList '/quiet', '/norestart', '/features', '+' -Wait -PassThru
            Write-Host "WDK installer exit code: $($proc.ExitCode)"
            $kit = Test-KitComplete $sdkVersion
          }
          if ($null -eq $kit) {
            throw "no complete Windows kit for $sdkVersion after installing the WDK"
          }
          Write-Host "kit providing SDK and WDK headers: $kit"

          foreach ($header in @('windows.h', 'd3dkmthk.h', 'd3dkmddi.h', 'd3d10umddi.h', 'd3dumddi.h')) {
            $found = Get-ChildItem -Path ($env:INCLUDE -split ';' | Where-Object { $_ -and (Test-Path $_) }) `
              -Filter $header -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $found) {
              throw "required SDK/WDK header not found on INCLUDE: $header"
            }
            if ($found.FullName -notmatch [regex]::Escape($sdkVersion)) {
              throw "$header resolves outside kit ${sdkVersion}: $($found.FullName)"
            }
            Write-Host "$header -> $($found.FullName)"
          }

      - name: Verify LLVM toolchain
        shell: pwsh
        run: |
          $clang = Get-Command clang-cl.exe -ErrorAction Stop
          $archiver = Get-Command llvm-lib.exe -ErrorAction Stop
          Write-Host "clang-cl -> $($clang.Path)"
          Write-Host "llvm-lib -> $($archiver.Path)"
          & $clang.Path --version

      - name: Set up Python build tools
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Meson generators
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade `
            "meson==1.9.1" mako packaging pyyaml

      - name: Install Windows flex and bison
        shell: pwsh
        run: |
          $flex = Get-Command win_flex.exe -ErrorAction SilentlyContinue
          $bison = Get-Command win_bison.exe -ErrorAction SilentlyContinue
          if ($null -eq $flex -or $null -eq $bison) {
            $winget = Get-Command winget.exe -ErrorAction SilentlyContinue
            if ($null -ne $winget) {
              & $winget.Source install --silent --accept-source-agreements --accept-package-agreements `
                --source winget --exact --id WinFlexBison.win_flex_bison --version 2.5.24
              if ($LASTEXITCODE -ne 0) {
                throw "WinFlexBison installation failed with exit code $LASTEXITCODE"
              }
            } else {
              $choco = Get-Command choco.exe -ErrorAction Stop
              & $choco.Source install winflexbison3 --yes --no-progress
              if ($LASTEXITCODE -ne 0) {
                throw "Chocolatey WinFlexBison installation failed with exit code $LASTEXITCODE"
              }
            }
            $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
            $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
            $env:Path = "$machinePath;$userPath;$env:Path"
            $flex = Get-Command win_flex.exe -ErrorAction SilentlyContinue
            $bison = Get-Command win_bison.exe -ErrorAction SilentlyContinue
          }
          if ($null -eq $flex -or $null -eq $bison) {
            throw "WinFlexBison binaries were not found after installation"
          }
          $flexItem = Get-Item -LiteralPath $flex.Path -Force
          $flexBin = Split-Path -Parent $flex.Path
          if ($flexItem.Target) {
            $flexBin = Split-Path -Parent ([string]$flexItem.Target)
          }
          $env:Path = "$flexBin;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $flexBin
          Write-Host "win_flex -> $($flex.Path)"
          Write-Host "win_bison -> $($bison.Path)"

      - name: Write an ARM64EC archiver wrapper
        shell: pwsh
        run: |
          # meson derives the archiver's /MACHINE flag from the cpu name and
          # emits /MACHINE:arm here, which llvm-lib refuses against arm64ec
          # objects ("file machine type arm64ec conflicts with library machine
          # type arm"). Drop whatever machine flag it passes and force the
          # right one.
          $wrapper = Join-Path $env:RUNNER_TEMP 'ar-arm64ec.py'
          # meson stops recognising llvm-lib once the archiver is a script and
          # falls back to GNU ar syntax ("csr <out> <objs>"), so accept both
          # forms and always emit llvm-lib's.
          $lines = @(
            'import subprocess, sys'
            'argv = sys.argv[1:]'
            'if argv and not argv[0].startswith("/") and not argv[0].startswith("-"):'
            '    out, objs = argv[1], argv[2:]'
            'else:'
            '    rest = [a for a in argv if not a.lower().startswith("/machine:")]'
            '    out = next((a[5:] for a in rest if a.lower().startswith("/out:")), None)'
            '    objs = [a for a in rest if not a.lower().startswith("/out:") and not a.startswith("/")]'
            'cmd = ["llvm-lib", "/NOLOGO", "/MACHINE:ARM64EC", "/OUT:" + out] + objs'
            'sys.exit(subprocess.call(cmd))'
          )
          Set-Content -LiteralPath $wrapper -Value $lines -Encoding ASCII
          "ARM64EC_AR=$wrapper" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Content $wrapper

      - name: Locate host shader compiler for Turnip
        shell: pwsh
        run: |
          $candidate = Get-Command glslangValidator.exe -ErrorAction SilentlyContinue
          if ($null -eq $candidate) {
            foreach ($root in @('C:\VulkanSDK', "$env:ProgramFiles\VulkanSDK")) {
              if (Test-Path $root) {
                $candidate = Get-ChildItem $root -Filter glslangValidator.exe -Recurse -File |
                  Select-Object -First 1
                if ($null -ne $candidate) { break }
              }
            }
          }
          if ($null -eq $candidate) {
            $version = '1.4.304.0'
            $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk.exe'
            Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe" -OutFile $installer
            $process = Start-Process $installer -ArgumentList '--am --al -c in' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw 'Vulkan SDK installation failed' }
            $candidate = Get-Item "C:\VulkanSDK\$version\Bin\glslangValidator.exe"
          }
          $shaderPath = $candidate.FullName
          if (!$shaderPath) { $shaderPath = $candidate.Source }
          if (!$shaderPath) { throw 'Missing host glslangValidator' }
          Split-Path -Parent $shaderPath | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Configure D3D10 UMD on zink
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP "mesa-d3d10-zink-arm64ec"
          $installDir = Join-Path $env:RUNNER_TEMP "mesa-d3d10-zink-install-arm64ec"
          if (Test-Path $buildDir) { Remove-Item -Recurse -Force $buildDir }
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          $mesonOptions = @(
            '--backend=ninja',
            '--buildtype=release',
            # meson does NOT imply NDEBUG from buildtype, so without this the
            # shipped UMD keeps every assert() and unreachable() live.  A failed
            # assert calls abort(), and abort() inside a D3D user-mode driver
            # takes down whatever loaded it - on this guest that is dwm.exe,
            # which then crash-loops (70 faults in the first 50 seconds of
            # uptime, __fastfail(FAST_FAIL_FATAL_APP_EXIT) from the CRT abort).
            # A user-mode driver must never abort its host process.
            '-Db_ndebug=true',
            # emit debug symbols even for the release build, so a crash in the
            # shipped UMD can be symbolicated instead of hand-attributed
            '-Ddebug=true',
            '-Dplatforms=windows',
            '-Dgallium-drivers=zink',
            '-Dvulkan-drivers=freedreno',
            '-Dfreedreno-kmds=wddm',
            '-Dgallium-d3d10umd=true',
            '-Dgallium-d3d10umd-backend=zink',
            '-Dgallium-d3d10-dll-name=viogpud3d_zink',
            '-Dopengl=false',
            '-Dgles1=disabled',
            '-Dgles2=disabled',
            '-Degl=disabled',
            '-Dglx=disabled',
            '-Dgbm=disabled',
            '-Dllvm=disabled',
            '-Dshader-cache=disabled',
            '-Dzlib=enabled',
            '-Dzstd=disabled',
            '-Db_vscrt=static_from_buildtype',
            '-Dtools=[]',
            '-Dbuild-tests=false',
            '-Dwerror=false',
            "-Dprefix=$installDir"
          )
          $env:CC = 'clang-cl'
          $env:CXX = 'clang-cl'
          $env:AR = 'llvm-lib'
          # Meson must not execute ARM64 sanity binaries on the x64 runner.
          $crossFile = Join-Path $env:RUNNER_TEMP 'mesa-d3d10-zink-arm64ec-cross.ini'
          $crossFileLines = @(
            '[binaries]'
            "c = ['clang-cl', '--target=arm64ec-pc-windows-msvc']"
            "cpp = ['clang-cl', '--target=arm64ec-pc-windows-msvc']"
            ("ar = ['python', '" + ($env:ARM64EC_AR -replace '\\', '/') + "']")
            ''
            '[host_machine]'
            "system = 'windows'"
            "cpu_family = 'aarch64'"
            "cpu = 'arm64ec'"
            "endian = 'little'"
            ''
            '[properties]'
            'needs_exe_wrapper = true'
            ''
            '[built-in options]'
            # clang-cl needs /Zi to emit debug info and lld-link needs /DEBUG to
            # write the PDB; meson's debug=true supplies the former but not the
            # latter for this cross setup, so the link step produced no symbols
            # at all.  Setting them here keeps the command line free for the
            # normal options.
            "c_args = ['/Zi']"
            "cpp_args = ['/Zi']"
            # The archiver wrapper cannot fix Meson's dynamic-link machine.
            # Its inferred /MACHINE:arm must be overridden for DLL links too.
            "c_link_args = ['/DEBUG', '/MACHINE:ARM64EC']"
            "cpp_link_args = ['/DEBUG', '/MACHINE:ARM64EC']"
          )
          Set-Content -LiteralPath $crossFile -Value $crossFileLines -Encoding ascii
          $setupArgs = @('setup', $buildDir, '.', '--cross-file', $crossFile) + $mesonOptions
          & meson @setupArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile and link the D3D10 UMD
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP "mesa-d3d10-zink-arm64ec"
          meson compile -C $buildDir --ninja-args=-k0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $library = Get-ChildItem -Path $buildDir -Recurse -File -Filter "viogpud3d_zink.dll" |
            Select-Object -First 1
          if ($null -eq $library) {
            throw "the zink D3D10 target did not produce viogpud3d_zink.dll"
          }
          Write-Host "Linked target: $($library.FullName)"
          $headers = & dumpbin /headers $library.FullName 2>&1
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for the linked target" }
          # ARM64EC objects are A641, but linked images use AMD64 (8664) plus
          # hybrid metadata. AA64 is a native ARM64 image, not this target.
          python bin/verify-arm64ec-pe.py $library.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Linked target is not an ARM64EC image' }
          $exports = & dumpbin /exports $library.FullName 2>&1
          foreach ($symbol in @('OpenAdapter10', 'OpenAdapter10_2')) {
            if (-not ($exports -match $symbol)) {
              throw "the D3D10 UMD must export $symbol"
            }
          }
          Write-Host 'ARM64EC D3D10 UMD links and exports its adapter entry points; runtime remains untested.'

      - name: Stage the ARM64EC user-mode driver
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP "mesa-d3d10-zink-arm64ec"
          $library = Get-ChildItem -Path $buildDir -Recurse -File -Filter "viogpud3d_zink.dll" |
            Select-Object -First 1
          if ($null -eq $library) { throw "the zink D3D10 target did not produce viogpud3d_zink.dll" }
          New-Item -ItemType Directory -Force arm64ec-umd | Out-Null
          Copy-Item $library.FullName (Join-Path 'arm64ec-umd' 'viogpud3dec.dll') -Force
          Get-FileHash (Join-Path 'arm64ec-umd' 'viogpud3dec.dll') -Algorithm SHA256 | Format-List
          & dumpbin /headers (Join-Path 'arm64ec-umd' 'viogpud3dec.dll') | Select-String -Pattern 'machine' | ForEach-Object { $_.Line.Trim() }

      - name: Upload the ARM64EC user-mode driver
        uses: actions/upload-artifact@v4
        with:
          name: viogpud3d-zink-arm64ec
          path: arm64ec-umd/viogpud3dec.dll
          if-no-files-found: error

      - name: Stage matching ARM64EC Turnip and runtime dependencies
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP 'mesa-d3d10-zink-arm64ec'
          $stageDir = 'arm64ec-runtime'
          New-Item -ItemType Directory $stageDir | Out-Null
          foreach ($name in @('viogpud3d_zink.dll', 'vulkan_freedreno.dll', 'z-1.dll')) {
            $files = @(Get-ChildItem $buildDir -Recurse -File -Filter $name)
            if ($files.Count -ne 1) { throw "Expected exactly one $name" }
            python bin/verify-arm64ec-pe.py $files[0].FullName
            if ($LASTEXITCODE -ne 0) { throw "Invalid ARM64EC image: $name" }
            $imports = & dumpbin /dependents $files[0].FullName 2>&1
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect $name imports" }
            $imports
            if ($imports -match '(?i)\b(?:msvcp|vcruntime)[0-9_]*\.dll\b') {
              throw "Unexpected dynamic CRT dependency: $name"
            }
            Copy-Item $files[0].FullName $stageDir
            $pdb = [IO.Path]::ChangeExtension($files[0].FullName, '.pdb')
            if (Test-Path $pdb) { Copy-Item $pdb $stageDir }
          }
          $exports = & dumpbin /exports "$stageDir/vulkan_freedreno.dll" 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect ICD exports' }
          foreach ($name in @('vk_icdNegotiateLoaderICDInterfaceVersion',
                             'vk_icdGetInstanceProcAddr', 'vk_icdGetPhysicalDeviceProcAddr')) {
            if (!($exports -match $name)) { throw "Missing ICD export: $name" }
          }
          python src/vulkan/util/vk_icd_gen.py --api-version 1.4 --xml src/vulkan/registry/vk.xml `
            --sizeof-pointer 8 --icd-lib-path . --icd-filename vulkan_freedreno.dll `
            --use-backslash --out "$stageDir/freedreno_icd.arm64ec.json"
          if ($LASTEXITCODE -ne 0) { throw 'ICD manifest generation failed' }
          $hashes = Get-ChildItem $stageDir -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName).Hash.ToLowerInvariant(), $_.Name
          }
          $hashes | Set-Content "$stageDir/SHA256SUMS.txt" -Encoding ascii
          Write-Host 'Compile-only candidate; no guest registration or runtime acceptance implied.'

      - uses: actions/upload-artifact@v4
        with:
          name: viogpu-arm64ec-runtime
          path: arm64ec-runtime/*
          if-no-files-found: error
