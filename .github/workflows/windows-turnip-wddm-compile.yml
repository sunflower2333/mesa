name: Windows Turnip WDDM transport compile

on:
  workflow_dispatch:
  push:
    branches:
      - wip/windows-turnip-wddm
    paths:
      - "src/freedreno/vulkan/tu_wddm_abi.h"
      - "src/freedreno/vulkan/tu_wddm_dispatch.h"
      - "src/freedreno/vulkan/tu_wddm_dispatch.cc"
      - "src/freedreno/vulkan/tu_knl_wddm.h"
      - "src/freedreno/vulkan/tu_knl_wddm.cc"
      - "src/freedreno/vulkan/tests/tu_wddm_abi_layout.cpp"
      - "src/freedreno/vulkan/tests/tu_wddm_abi_manifest.cpp"
      - "src/freedreno/vulkan/tests/tu_wddm_abi_manifest_entries.h"
      - "src/freedreno/vulkan/tests/tu_wddm_abi_expected.txt"
      - "src/freedreno/vulkan/tests/tu_wddm_render_test.cpp"
      - "src/freedreno/vulkan/tests/tu_wddm_kmt_probe.cpp"
      - "src/freedreno/vulkan/tests/tu_wddm_vulkan_probe.cpp"
      - "src/freedreno/vulkan/tests/tu_wddm_vulkan_compute_probe.cpp"
      - "src/freedreno/vulkan/tests/tu_wddm_vulkan_graphics_probe.cpp"
      - "src/freedreno/vulkan/tests/tu_wddm_win32_probe.cpp"
      - "src/freedreno/vulkan/tests/tu_wddm_compute.comp"
      - "src/freedreno/vulkan/tests/tu_wddm_graphics.vert"
      - "src/freedreno/vulkan/tests/tu_wddm_graphics.frag"
      - "src/freedreno/vulkan/tests/tu_wddm_transport_compile.cpp"
      - "src/freedreno/vulkan/tests/check_tu_wddm_policy.py"
      - "src/freedreno/tests/**"
      - "src/freedreno/vulkan/**"
      - "meson.build"
      - "meson.options"
      - ".github/workflows/windows-turnip-wddm-compile.yml"

permissions:
  contents: read

jobs:
  compile:
    name: ARM64 SDK/WDK compile
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC and WDK
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64_arm64

      - name: Verify required SDK headers
        shell: pwsh
        run: |
          $headers = @('windows.h', 'd3dkmthk.h')
          foreach ($header in $headers) {
            $found = Get-ChildItem -Path ($env:INCLUDE -split ';') -Filter $header -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $found) {
              throw "required SDK/WDK header not found: $header"
            }
            Write-Host "$header -> $($found.FullName)"
          }

      - name: Compile WDDM transport
        shell: cmd
        run: >-
          cl /nologo /std:c++17 /W4 /WX /EHsc /c
          /D_WIN32_WINNT=0x0A00 /DNTDDI_VERSION=0x0A00000C
          /I src\freedreno\vulkan
          src\freedreno\vulkan\tu_wddm_dispatch.cc
          src\freedreno\vulkan\tu_knl_wddm.cc
          src\freedreno\vulkan\tests\tu_wddm_render_test.cpp
          src\freedreno\vulkan\tests\tu_wddm_kmt_probe.cpp
          src\freedreno\vulkan\tests\tu_wddm_transport_compile.cpp

      - name: Link ARM64 fake-dispatch fixture
        shell: cmd
        run: >-
          cl /nologo /std:c++17 /W4 /WX /EHsc
          /D_WIN32_WINNT=0x0A00 /DNTDDI_VERSION=0x0A00000C
          /I src\freedreno\vulkan
          src\freedreno\vulkan\tu_knl_wddm.cc
          src\freedreno\vulkan\tests\tu_wddm_render_test.cpp
          /Fe:tu_wddm_render_test_arm64.exe

      - name: Verify ARM64 fixture image
        shell: pwsh
        run: |
          $fixture = Join-Path $PWD 'tu_wddm_render_test_arm64.exe'
          if (-not (Test-Path -LiteralPath $fixture -PathType Leaf) -or
              (Get-Item -LiteralPath $fixture).Length -eq 0) {
            throw "ARM64 fake-dispatch fixture did not link"
          }
          $headers = & dumpbin /headers $fixture 2>&1
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for ARM64 fixture" }
          if (-not ($headers -match 'AA64 machine')) {
            throw "fake-dispatch fixture machine type does not match ARM64"
          }
          Write-Host 'ARM64 fixture linked successfully; it is not executed on the cross-build host.'

      - name: Upload ARM64 fake-dispatch runtime fixture
        uses: actions/upload-artifact@v7
        with:
          name: tu-wddm-fake-dispatch-arm64
          path: tu_wddm_render_test_arm64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Assert compile-only artifact policy
        shell: pwsh
        run: |
          if (Get-ChildItem -Path . -Recurse -File -Include *.sys,*.inf,*.cat -ErrorAction SilentlyContinue) {
            throw "compile-only job produced a driver artifact"
          }
          Write-Host "No driver, INF, package, or installation step is part of this gate."

  full-target:
    name: ARM64 full Turnip WDDM link (clang-cl)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC and WDK
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64_arm64

      - name: Verify LLVM toolchain
        shell: pwsh
        run: |
          $clang = Get-Command clang-cl.exe -ErrorAction Stop
          $archiver = Get-Command llvm-lib.exe -ErrorAction Stop
          Write-Host "clang-cl -> $($clang.Path)"
          Write-Host "llvm-lib -> $($archiver.Path)"
          & $clang.Path --version

      - name: Set up Python build tools
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Meson generators
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade `
            "meson==1.9.1" mako packaging pyyaml

      - name: Verify WDDM pageable-memory and residency policy
        shell: pwsh
        run: python src/freedreno/vulkan/tests/check_tu_wddm_policy.py

      - name: Install Windows flex and bison
        shell: pwsh
        run: |
          $flex = Get-Command win_flex.exe -ErrorAction SilentlyContinue
          $bison = Get-Command win_bison.exe -ErrorAction SilentlyContinue
          if ($null -eq $flex -or $null -eq $bison) {
            $winget = Get-Command winget.exe -ErrorAction SilentlyContinue
            if ($null -ne $winget) {
              & $winget.Source install --silent --accept-source-agreements --accept-package-agreements `
                --source winget --exact --id WinFlexBison.win_flex_bison --version 2.5.24
              if ($LASTEXITCODE -ne 0) {
                throw "WinFlexBison installation failed with exit code $LASTEXITCODE"
              }
            } else {
              $choco = Get-Command choco.exe -ErrorAction Stop
              & $choco.Source install winflexbison3 --yes --no-progress
              if ($LASTEXITCODE -ne 0) {
                throw "Chocolatey WinFlexBison installation failed with exit code $LASTEXITCODE"
              }
            }
            $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
            $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
            $env:Path = "$machinePath;$userPath;$env:Path"
            $flex = Get-Command win_flex.exe -ErrorAction SilentlyContinue
            $bison = Get-Command win_bison.exe -ErrorAction SilentlyContinue
          }
          if ($null -eq $flex -or $null -eq $bison) {
            throw "WinFlexBison binaries were not found after installation"
          }
          $flexItem = Get-Item -LiteralPath $flex.Path -Force
          $flexBin = Split-Path -Parent $flex.Path
          if ($flexItem.Target) {
            $flexBin = Split-Path -Parent ([string]$flexItem.Target)
          }
          $env:Path = "$flexBin;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $flexBin
          Write-Host "win_flex -> $($flex.Path)"
          Write-Host "win_bison -> $($bison.Path)"

      - name: Locate shader compiler
        shell: pwsh
        run: |
          $candidate = Get-Command glslangValidator.exe -ErrorAction SilentlyContinue
          if ($null -eq $candidate) {
            $roots = @("C:\VulkanSDK", "$env:ProgramFiles\VulkanSDK")
            foreach ($root in $roots) {
              if (Test-Path $root) {
                $candidate = Get-ChildItem -Path $root -Filter glslangValidator.exe -Recurse -File -ErrorAction SilentlyContinue |
                  Select-Object -First 1
                if ($null -ne $candidate) { break }
              }
            }
          }
          if ($null -eq $candidate) {
            $version = "1.4.304.0"
            $installer = Join-Path $env:RUNNER_TEMP "vulkan-sdk.exe"
            $url = "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe"
            Invoke-WebRequest -Uri $url -OutFile $installer
            $process = Start-Process -FilePath $installer -ArgumentList "--am --al -c in" -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "Vulkan SDK installer failed with exit code $($process.ExitCode)"
            }
            $candidate = Get-ChildItem -Path "C:\VulkanSDK\$version\Bin" -Filter glslangValidator.exe -File -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }
          if ($null -eq $candidate) {
            throw "glslangValidator.exe is required to generate the Turnip shader headers"
          }
          # Get-Command returns a CommandInfo while Get-ChildItem returns a
          # FileInfo.  FileInfo.Source is unset on hosted runners, so always
          # resolve the executable path before asking for its parent.
          $shaderPath = $candidate.FullName
          if ([string]::IsNullOrEmpty($shaderPath)) {
            $shaderPath = $candidate.Source
          }
          if ([string]::IsNullOrEmpty($shaderPath)) {
            throw "glslangValidator path could not be resolved"
          }
          $shaderBin = Split-Path -Parent $shaderPath
          Write-Host "glslangValidator -> $shaderPath"
          Add-Content -Path $env:GITHUB_PATH -Value $shaderBin

      - name: Configure full Turnip target
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP "mesa-turnip-wddm-arm64"
          $installDir = Join-Path $env:RUNNER_TEMP "mesa-turnip-wddm-install-arm64"
          if (Test-Path $buildDir) { Remove-Item -Recurse -Force $buildDir }
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          $mesonOptions = @(
            '--backend=ninja',
            '--buildtype=release',
            '-Dplatforms=windows',
            '-Dvulkan-drivers=freedreno',
            '-Dfreedreno-kmds=wddm',
            '-Dgallium-drivers=[]',
            '-Dopengl=false',
            '-Dgles1=disabled',
            '-Dgles2=disabled',
            '-Degl=disabled',
            '-Dglx=disabled',
            '-Dgbm=disabled',
            '-Dllvm=disabled',
            '-Dshader-cache=disabled',
            '-Dzlib=enabled',
            '-Dzstd=disabled',
            '-Db_vscrt=static_from_buildtype',
            '-Dtools=[]',
            '-Dbuild-tests=false',
            '-Dwerror=false',
            "-Dprefix=$installDir"
          )
          $env:CC = 'clang-cl'
          $env:CXX = 'clang-cl'
          $env:AR = 'llvm-lib'
          $setupArgs = @('setup', $buildDir, '.')
          # Meson must not execute ARM64 sanity binaries on the x64 runner.
          $crossFile = Join-Path $env:RUNNER_TEMP 'mesa-turnip-wddm-arm64-cross.ini'
          $crossFileLines = @(
            '[binaries]'
            "c = ['clang-cl', '--target=aarch64-pc-windows-msvc']"
            "cpp = ['clang-cl', '--target=aarch64-pc-windows-msvc']"
            "ar = 'llvm-lib'"
            ''
            '[host_machine]'
            "system = 'windows'"
            "cpu_family = 'aarch64'"
            "cpu = 'arm64'"
            "endian = 'little'"
            ''
            '[properties]'
            'needs_exe_wrapper = true'
          )
          Set-Content -LiteralPath $crossFile -Value $crossFileLines -Encoding ascii
          $setupArgs += @('--cross-file', $crossFile)
          $setupArgs += $mesonOptions
          & meson @setupArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile and link full Turnip target
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP "mesa-turnip-wddm-arm64"
          meson compile -C $buildDir --ninja-args=-k0 vulkan_freedreno freedreno_icd
          $library = Get-ChildItem -Path $buildDir -Recurse -File -Filter "vulkan_freedreno.dll" |
            Select-Object -First 1
          if ($null -eq $library) {
            throw "full Turnip target did not produce vulkan_freedreno.dll"
          }
          Write-Host "Linked target: $($library.FullName)"
          $headers = & dumpbin /headers $library.FullName 2>&1
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for linked target" }
          $headers | Select-String "machine" | Select-Object -First 1
          $expectedMachine = "AA64 machine"
          if (-not ($headers -match $expectedMachine)) {
            throw "linked target machine type does not match ARM64"
          }

      - name: Verify WDDM Win32 CPU/GDI WSI policy
        shell: pwsh
        run: |
          $wsi = Get-Content -LiteralPath 'src/freedreno/vulkan/tu_wsi.cc' -Raw
          $wsiHeader = Get-Content -LiteralPath 'src/freedreno/vulkan/tu_wsi.h' -Raw
          $tuMeson = Get-Content -LiteralPath 'src/freedreno/vulkan/meson.build' -Raw
          if ($wsi -notmatch '(?s)VK_USE_PLATFORM_WIN32_KHR.*TU_HAS_WDDM.*?\.sw_device\s*=\s*true') {
            throw 'WDDM Win32 WSI must select the CPU/GDI software swapchain path'
          }
          if ($wsi -notmatch 'supports_modifiers' -or
              $wsi -notmatch 'supports_modifiers[\s\S]{0,240}false') {
            throw 'WDDM Win32 WSI must not advertise DRM modifiers'
          }
          if ($wsiHeader -notmatch 'VK_USE_PLATFORM_WIN32_KHR') {
            throw 'Turnip WSI header is not wired for VK_KHR_win32_surface'
          }
          if ($tuMeson -notmatch '(?s)if\s+with_platform_windows\s*\r?\n\s*tu_wsi\s*=\s*true') {
            throw 'Windows platform does not compile the Turnip WSI source'
          }
          $computeProbe = Get-Content -LiteralPath 'src/freedreno/vulkan/tests/tu_wddm_vulkan_compute_probe.cpp' -Raw
          foreach ($fragment in @('QueueSubmit', 'WaitForFences', 'CmdDispatch', 'MapMemory')) {
            if ($computeProbe.IndexOf($fragment, [StringComparison]::Ordinal) -lt 0) {
              throw "compute workload probe is missing required operation: $fragment"
            }
          }
          $graphicsProbe = Get-Content -LiteralPath 'src/freedreno/vulkan/tests/tu_wddm_vulkan_graphics_probe.cpp' -Raw
          foreach ($fragment in @('CreateGraphicsPipelines', 'CmdDraw', 'CmdCopyImageToBuffer',
                                  'QueueSubmit', 'WaitForFences')) {
            if ($graphicsProbe.IndexOf($fragment, [StringComparison]::Ordinal) -lt 0) {
              throw "offscreen graphics workload probe is missing required operation: $fragment"
            }
          }
          $win32Probe = Get-Content -LiteralPath 'src/freedreno/vulkan/tests/tu_wddm_win32_probe.cpp' -Raw
          foreach ($fragment in @('vkCreateWin32SurfaceKHR', 'vkCreateSwapchainKHR', 'vkAcquireNextImageKHR',
                                  'QueueSubmit', 'CmdClearColorImage', 'vkQueuePresentKHR',
                                  'oldSwapchain = old_swapchain', 'VK_PRESENT_MODE_FIFO_KHR',
                                  'ShowWindow(window, SW_MINIMIZE)')) {
            if ($win32Probe.IndexOf($fragment, [StringComparison]::Ordinal) -lt 0) {
              throw "Win32 workload probe is missing required operation: $fragment"
            }
          }
          $kmtProbe = Get-Content -LiteralPath 'src/freedreno/vulkan/tests/tu_wddm_kmt_probe.cpp' -Raw
          foreach ($fragment in @('tu_wddm_allocation_create', 'tu_wddm_allocation_lock',
                                  'tu_wddm_allocation_unlock', 'tu_wddm_allocation_destroy',
                                  'CreateAllocation(native 4KiB)', 'DestroyAllocation(native 4KiB)',
                                  '--submit-nop', 'tu_wddm_context_render', 'kCpNop')) {
            if ($kmtProbe.IndexOf($fragment, [StringComparison]::Ordinal) -lt 0) {
              throw "KMT probe is missing bounded allocation lifecycle phase: $fragment"
            }
          }
          Write-Host 'WDDM Win32 WSI policy selects CPU/GDI and disables DRM modifiers.'

      - name: Build ARM64 app-local Vulkan runtime probe
        shell: cmd
        run: >-
          cl /nologo /std:c++17 /W4 /WX /EHsc
          /MT
          /I include
          src\freedreno\vulkan\tests\tu_wddm_vulkan_probe.cpp
          /Fe:tu_wddm_vulkan_probe_arm64.exe

      - name: Build ARM64 direct KMT bring-up probe
        shell: cmd
        run: >-
          cl /nologo /std:c++17 /W4 /WX /EHsc
          /MT
          /I src\freedreno\vulkan
          src\freedreno\vulkan\tu_wddm_dispatch.cc
          src\freedreno\vulkan\tu_knl_wddm.cc
          src\freedreno\vulkan\tests\tu_wddm_kmt_probe.cpp
          /Fe:tu_wddm_kmt_probe_arm64.exe

      - name: Build ARM64 compute, offscreen graphics, and Win32 WSI probes
        shell: pwsh
        run: |
          $computeShader = Join-Path $PWD 'tu_wddm_compute.spv'
          & glslangValidator.exe -V --target-env vulkan1.1 -S comp -o $computeShader `
            'src/freedreno/vulkan/tests/tu_wddm_compute.comp'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $computeShader -PathType Leaf)) {
            throw 'compute shader compilation failed'
          }
          $vertexShader = Join-Path $PWD 'tu_wddm_graphics.vert.spv'
          & glslangValidator.exe -V --target-env vulkan1.1 -S vert -o $vertexShader `
            'src/freedreno/vulkan/tests/tu_wddm_graphics.vert'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $vertexShader -PathType Leaf)) {
            throw 'graphics vertex shader compilation failed'
          }
          $fragmentShader = Join-Path $PWD 'tu_wddm_graphics.frag.spv'
          & glslangValidator.exe -V --target-env vulkan1.1 -S frag -o $fragmentShader `
            'src/freedreno/vulkan/tests/tu_wddm_graphics.frag'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $fragmentShader -PathType Leaf)) {
            throw 'graphics fragment shader compilation failed'
          }
          cl /nologo /std:c++17 /W4 /WX /EHsc /MT /I include `
            src/freedreno/vulkan/tests/tu_wddm_vulkan_compute_probe.cpp `
            /Fe:tu_wddm_vulkan_compute_probe_arm64.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /std:c++17 /W4 /WX /EHsc /MT /I include `
            src/freedreno/vulkan/tests/tu_wddm_vulkan_graphics_probe.cpp `
            /Fe:tu_wddm_vulkan_graphics_probe_arm64.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /std:c++17 /W4 /WX /EHsc /MT /I include `
            src/freedreno/vulkan/tests/tu_wddm_win32_probe.cpp `
            /Fe:tu_wddm_win32_probe_arm64.exe user32.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and upload ARM64 Vulkan runtime probe
        shell: pwsh
        run: |
          $probe = Join-Path $PWD 'tu_wddm_vulkan_probe_arm64.exe'
          if (-not (Test-Path -LiteralPath $probe -PathType Leaf) -or
              (Get-Item -LiteralPath $probe).Length -eq 0) {
            throw 'ARM64 Vulkan runtime probe did not link'
          }
          $headers = & dumpbin /headers $probe 2>&1
          if ($LASTEXITCODE -ne 0 -or -not ($headers -match 'AA64 machine')) {
            throw 'Vulkan runtime probe machine type does not match ARM64'
          }
          $probeDependents = & dumpbin /dependents $probe 2>&1
          if ($LASTEXITCODE -ne 0 -or
              $probeDependents -match '(?i)\b(?:msvcp|vcruntime)[0-9_]*\.dll\b') {
            throw 'Vulkan runtime probe has an undeclared dynamic MSVC runtime dependency'
          }
          Write-Host 'ARM64 Vulkan runtime probe linked; it requires the app-local Turnip DLL at runtime.'

          foreach ($name in @('tu_wddm_kmt_probe_arm64.exe',
                              'tu_wddm_vulkan_compute_probe_arm64.exe',
                              'tu_wddm_vulkan_graphics_probe_arm64.exe',
                              'tu_wddm_win32_probe_arm64.exe')) {
            $path = Join-Path $PWD $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "missing ARM64 workload probe: $name"
            }
            $probeHeaders = & dumpbin /headers $path 2>&1
            if ($LASTEXITCODE -ne 0 -or -not ($probeHeaders -match 'AA64 machine')) {
              throw "$name machine type does not match ARM64"
            }
            $probeDependents = & dumpbin /dependents $path 2>&1
            if ($LASTEXITCODE -ne 0 -or
                $probeDependents -match '(?i)\b(?:msvcp|vcruntime)[0-9_]*\.dll\b') {
              throw "$name has an undeclared dynamic MSVC runtime dependency"
            }
          }
          foreach ($shader in @('tu_wddm_compute.spv', 'tu_wddm_graphics.vert.spv',
                                'tu_wddm_graphics.frag.spv')) {
            if (-not (Test-Path -LiteralPath (Join-Path $PWD $shader) -PathType Leaf)) {
              throw "compiled workload shader is missing: $shader"
            }
          }

      - name: Upload ARM64 Vulkan runtime probe
        uses: actions/upload-artifact@v7
        with:
          name: tu-wddm-vulkan-probe-arm64
          path: |
            tu_wddm_kmt_probe_arm64.exe
            tu_wddm_vulkan_probe_arm64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload ARM64 Vulkan workload probes
        uses: actions/upload-artifact@v7
        with:
          name: tu-wddm-vulkan-workloads-arm64
          path: |
            tu_wddm_vulkan_compute_probe_arm64.exe
            tu_wddm_vulkan_graphics_probe_arm64.exe
            tu_wddm_win32_probe_arm64.exe
            tu_wddm_compute.spv
            tu_wddm_graphics.vert.spv
            tu_wddm_graphics.frag.spv
          if-no-files-found: error
          retention-days: 7

      - name: Stage ARM64 Turnip ICD bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = Join-Path $env:RUNNER_TEMP "mesa-turnip-wddm-arm64"
          $stageDir = Join-Path $env:RUNNER_TEMP "turnip-wddm-arm64-icd"
          if (Test-Path $stageDir) { Remove-Item -Recurse -Force $stageDir }
          New-Item -ItemType Directory -Path $stageDir | Out-Null

          $libraries = @(Get-ChildItem -Path $buildDir -Recurse -File -Filter "vulkan_freedreno.dll")
          if ($libraries.Count -ne 1) {
            throw "expected exactly one ARM64 vulkan_freedreno.dll, found $($libraries.Count)"
          }
          $zlibLibraries = @(Get-ChildItem -Path $buildDir -Recurse -File -Filter "z-1.dll")
          if ($zlibLibraries.Count -ne 1) {
            throw "expected exactly one ARM64 z-1.dll dependency, found $($zlibLibraries.Count)"
          }
          $mesonManifests = @(
            Get-ChildItem -Path $buildDir -Recurse -File -Filter "freedreno_icd.arm64.json"
          )
          if ($mesonManifests.Count -ne 1) {
            throw "expected exactly one Meson ARM64 ICD manifest, found $($mesonManifests.Count)"
          }
          $mesonIcd = Get-Content -LiteralPath $mesonManifests[0].FullName -Raw |
            ConvertFrom-Json
          if ($mesonIcd.file_format_version -ne '1.0.1' -or
              $mesonIcd.ICD.library_path -match '/' -or
              $mesonIcd.ICD.library_path -notmatch '\\vulkan_freedreno\.dll$' -or
              $mesonIcd.ICD.library_arch -ne '64') {
            throw "Meson ARM64 ICD manifest does not use a valid Windows library path"
          }

          $exports = & dumpbin /exports $libraries[0].FullName 2>&1
          if ($LASTEXITCODE -ne 0) { throw "dumpbin exports failed for Turnip ICD" }
          foreach ($symbol in @(
            'vk_icdNegotiateLoaderICDInterfaceVersion',
            'vk_icdGetInstanceProcAddr',
            'vk_icdGetPhysicalDeviceProcAddr'
          )) {
            if (-not ($exports | Select-String -SimpleMatch $symbol)) {
              throw "Turnip ICD is missing required loader export: $symbol"
            }
          }

          $dependents = & dumpbin /dependents $libraries[0].FullName 2>&1
          if ($LASTEXITCODE -ne 0) { throw "dumpbin dependents failed for Turnip ICD" }
          if (-not ($dependents | Select-String -SimpleMatch 'z-1.dll')) {
            throw "Turnip ICD no longer imports the staged z-1.dll dependency"
          }

          foreach ($pe in @($libraries[0], $zlibLibraries[0])) {
            $peDependents = & dumpbin /dependents $pe.FullName 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin dependents failed for $($pe.Name)"
            }
            if ($peDependents -match '(?i)\b(?:msvcp|vcruntime)[0-9_]*\.dll\b') {
              throw "$($pe.Name) has an undeclared dynamic MSVC runtime dependency"
            }
          }

          foreach ($pe in @($libraries[0], $zlibLibraries[0])) {
            $headers = & dumpbin /headers $pe.FullName 2>&1
            if ($LASTEXITCODE -ne 0 -or -not ($headers -match 'AA64 machine')) {
              throw "$($pe.Name) is not an ARM64 PE image"
            }
            Copy-Item -LiteralPath $pe.FullName -Destination $stageDir
          }

          $manifest = Join-Path $stageDir 'freedreno_icd.arm64.json'
          & python src/vulkan/util/vk_icd_gen.py `
            --api-version 1.4 --xml src/vulkan/registry/vk.xml `
            --sizeof-pointer 8 --icd-lib-path . `
            --icd-filename vulkan_freedreno.dll `
            --use-backslash --out $manifest
          if ($LASTEXITCODE -ne 0) { throw "ICD manifest generation failed" }

          $icd = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          if ($icd.file_format_version -ne '1.0.1' -or
              $icd.ICD.library_path -ne '.\vulkan_freedreno.dll' -or
              $icd.ICD.library_arch -ne '64' -or
              $icd.ICD.api_version -notmatch '^1\.4\.[0-9]+$') {
            throw "ARM64 ICD manifest has unexpected contents"
          }

          $installerSource = Resolve-Path 'src/freedreno/vulkan/turnip-wddm-icd.ps1'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $installerSource.Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) {
            throw "Turnip ICD manager has PowerShell parse errors: $($parseErrors -join '; ')"
          }
          $installerText = Get-Content -LiteralPath $installerSource.Path -Raw
          foreach ($fragment in @(
            'function Get-Sha256',
            'function Get-VulkanDriverValueSnapshot',
            'function Restore-VulkanDriverValue',
            'function New-IcdTransactionRoot',
            "`$registrySnapshot = Get-VulkanDriverValueSnapshot",
            'Turnip ICD install failed and rollback also failed',
            'Turnip ICD uninstall failed and rollback also failed'
          )) {
            if ($installerText.IndexOf($fragment, [StringComparison]::Ordinal) -lt 0) {
              throw "Turnip ICD manager is missing transactional policy: $fragment"
            }
          }
          Copy-Item -LiteralPath $installerSource.Path `
            -Destination $stageDir
          Copy-Item -LiteralPath 'src/freedreno/vulkan/TURNIP_WDDM_ICD.md' `
            -Destination $stageDir
          foreach ($workload in @(
            'tu_wddm_kmt_probe_arm64.exe',
            'tu_wddm_vulkan_probe_arm64.exe',
            'tu_wddm_vulkan_compute_probe_arm64.exe',
            'tu_wddm_vulkan_graphics_probe_arm64.exe',
            'tu_wddm_win32_probe_arm64.exe',
            'tu_wddm_compute.spv',
            'tu_wddm_graphics.vert.spv',
            'tu_wddm_graphics.frag.spv'
          )) {
            $workloadPath = Join-Path $PWD $workload
            if (-not (Test-Path -LiteralPath $workloadPath -PathType Leaf)) {
              throw "missing runtime workload for the staged bundle: $workload"
            }
            Copy-Item -LiteralPath $workloadPath -Destination $stageDir
          }

          $forbidden = Get-ChildItem -Path $stageDir -Recurse -File `
            -Include *.sys,*.inf,*.cat,*.msix,*.appx -ErrorAction SilentlyContinue
          if ($null -ne $forbidden -and $forbidden.Count -ne 0) {
            throw "Turnip UMD bundle contains a kernel driver package"
          }

          $hashLines = Get-ChildItem -Path $stageDir -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          Set-Content -LiteralPath (Join-Path $stageDir 'SHA256SUMS.txt') `
            -Value $hashLines -Encoding ascii

      - name: Assert UMD-only package policy
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP "mesa-turnip-wddm-arm64"
          $forbidden = Get-ChildItem -Path $buildDir -Recurse -File -Include *.sys,*.inf,*.cat,*.msix,*.appx -ErrorAction SilentlyContinue
          if ($null -ne $forbidden -and $forbidden.Count -ne 0) {
            throw "full-target gate produced a driver/package artifact"
          }
          Write-Host "Turnip bundle contains no kernel driver and performs no CI installation or loading."

      - name: Upload ARM64 Turnip ICD bundle
        uses: actions/upload-artifact@v7
        with:
          name: turnip-wddm-arm64-icd-bundle
          path: ${{ runner.temp }}/turnip-wddm-arm64-icd/*
          if-no-files-found: error
          retention-days: 7
