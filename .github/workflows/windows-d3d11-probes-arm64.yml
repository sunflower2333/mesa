name: Windows D3D11 shared resource probes (ARM64)

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/gallium/targets/d3d10umd/tests/d3d11_shared_test.cpp'
      - '.github/workflows/windows-d3d11-probes-arm64.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64_arm64
      - name: Build native ARM64 probe with SDK only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path probes | Out-Null
          cl /nologo /std:c++17 /EHsc /W4 /WX /MT /Zi `
            src/gallium/targets/d3d10umd/tests/d3d11_shared_test.cpp `
            /Fe:probes/d3d11_shared_test.exe /Fo:probes/ /Fd:probes/compiler.pdb `
            /link /DEBUG /PDB:probes/d3d11_shared_test.pdb d3d11.lib dxgi.lib dcomp.lib user32.lib d3dcompiler.lib
          if ($LASTEXITCODE -ne 0) { throw 'Probe compilation failed' }
          $bytes = [IO.File]::ReadAllBytes('probes/d3d11_shared_test.exe')
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0xaa64) {
            throw 'Probe is not ARM64'
          }
          Get-FileHash probes/d3d11_shared_test.exe | Format-List
          Write-Host 'Compile gate only; shared pixels and composition must run on the VIOGPU guest.'
      - uses: actions/upload-artifact@v4
        with:
          name: d3d11-shared-probe-arm64
          path: |
            probes/d3d11_shared_test.exe
            probes/d3d11_shared_test.pdb
          if-no-files-found: error
