name: Windows graphics probes (ARM64, x64, x86)

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/gallium/targets/d3d10umd/tests/d3d11_shared_test.cpp'
      - 'src/gallium/targets/d3d10umd/tests/d3d11_present_test.cpp'
      - 'src/freedreno/vulkan/tests/tu_wddm_vulkan_compute_probe.cpp'
      - '.github/workflows/windows-d3d11-probes-arm64.yml'

permissions:
  contents: read

jobs:
  signatures:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Validate compiled shader linkage with positive and negative controls
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path signatures | Out-Null
          cl /nologo /std:c++17 /EHsc /W4 /WX /MT `
            src/gallium/targets/d3d10umd/tests/d3d11_shared_test.cpp `
            /Fe:signatures/check.exe /Fo:signatures/ `
            /link d3d11.lib dxgi.lib dcomp.lib user32.lib d3dcompiler.lib
          if ($LASTEXITCODE -ne 0) { throw 'Signature test compilation failed' }
          & ./signatures/check.exe --buffer-signatures
          if ($LASTEXITCODE -ne 0) { throw 'Compiled shader signatures failed' }
  build:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: arm64
            compiler: x64_arm64
            machine: '0xaa64'
          - target: x64
            compiler: x64
            machine: '0x8664'
          - target: x86
            compiler: x64_x86
            machine: '0x014c'
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.compiler }}
      - name: Build shared-resource probe with SDK only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path probes | Out-Null
          cl /nologo /std:c++17 /EHsc /W4 /WX /MT /Zi `
            src/gallium/targets/d3d10umd/tests/d3d11_shared_test.cpp `
            /Fe:probes/d3d11_shared_test.exe /Fo:probes/ /Fd:probes/compiler.pdb `
            /link /DEBUG /PDB:probes/d3d11_shared_test.pdb d3d11.lib dxgi.lib dcomp.lib user32.lib d3dcompiler.lib
          if ($LASTEXITCODE -ne 0) { throw 'Probe compilation failed' }
          $bytes = [IO.File]::ReadAllBytes('probes/d3d11_shared_test.exe')
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne ${{ matrix.machine }}) {
            throw 'Probe architecture mismatch'
          }
          Get-FileHash probes/d3d11_shared_test.exe | Format-List
          Write-Host 'Compile gate only; shared pixels and composition must run on the VIOGPU guest.'
      - name: Build scanout timing probe
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /EHsc /W3 /MT /Zi `
            src/gallium/targets/d3d10umd/tests/d3d11_present_test.cpp `
            /Fe:probes/d3d11_present_test.exe /Fo:probes/ /Fd:probes/present-compiler.pdb `
            /link /DEBUG /PDB:probes/d3d11_present_test.pdb d3d11.lib dxgi.lib dcomp.lib user32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Present probe compilation failed' }
          $bytes = [IO.File]::ReadAllBytes('probes/d3d11_present_test.exe')
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne ${{ matrix.machine }}) {
            throw 'Present probe architecture mismatch'
          }
          Get-FileHash probes/d3d11_present_test.exe | Format-List
      - name: Build Vulkan compute and buffer-copy probe
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX /MT /I include `
            src/freedreno/vulkan/tests/tu_wddm_vulkan_compute_probe.cpp `
            /Fe:probes/tu_wddm_vulkan_compute_probe_${{ matrix.target }}.exe /Fo:probes/
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan probe compilation failed' }
          $bytes = [IO.File]::ReadAllBytes('probes/tu_wddm_vulkan_compute_probe_${{ matrix.target }}.exe')
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne ${{ matrix.machine }}) {
            throw 'Vulkan probe architecture mismatch'
          }
          Get-FileHash probes/tu_wddm_vulkan_compute_probe_${{ matrix.target }}.exe | Format-List
          Write-Host 'Use the matching tu_wddm_compute.spv from the full Turnip workload artifact.'
      - uses: actions/upload-artifact@v4
        with:
          name: tu-wddm-compute-probe-${{ matrix.target }}
          path: probes/tu_wddm_vulkan_compute_probe_${{ matrix.target }}.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: d3d11-shared-probe-${{ matrix.target }}
          path: |
            probes/d3d11_shared_test.exe
            probes/d3d11_shared_test.pdb
            probes/d3d11_present_test.exe
            probes/d3d11_present_test.pdb
          if-no-files-found: error
