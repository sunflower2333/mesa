name: Materialize tested Turnip lifetime source once

on:
  push:
    branches: [perf/droidvm-gpu-20260914]
    paths: ['.github/workflows/turnip-perf-materialize.yml']

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'sunflower2333/mesa' && github.ref == 'refs/heads/perf/droidvm-gpu-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify patch, run production tests, create matching Git objects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          repo = 'sunflower2333/mesa'
          base = '47ddefd721465442293780a270a649860688ef21'
          cleanup = '.github/workflows/turnip-perf-materialize.yml'
          expected_tree = 'e5ff66bf7621ffc2e49c91348de817a9e86fc288'
          manifest = [{'path': '.github/workflows/turnip-perf-source.yml', 'sha': '251923ad95ce1ccafa262e5e4813b84b4df73bee', 'mode': '100644'}, {'path': '.github/workflows/windows-turnip-wddm-compile.yml', 'sha': 'a75498905db6b85e5b95d1cb4401b50ecab78d6c', 'mode': '100644'}, {'path': 'src/freedreno/vulkan/tests/check_tu_wddm_policy.py', 'sha': '3daf0d28c7c82c4603a4194e09617fda53d871f0', 'mode': '100644'}, {'path': 'src/freedreno/vulkan/tests/lifetime-perf/README.md', 'sha': '63abb096c2df85997f58df3266881875c8fa64b0', 'mode': '100644'}, {'path': 'src/freedreno/vulkan/tests/lifetime-perf/lifetime_test.cpp', 'sha': '8036823babf949242e1e39cacf4293dbd105faac', 'mode': '100644'}, {'path': 'src/freedreno/vulkan/tests/lifetime-perf/run.py', 'sha': '2498518ba6b3214e493a5759e7f71680a573465a', 'mode': '100644'}, {'path': 'src/freedreno/vulkan/tu_device.h', 'sha': '0360045c82c9e8f43ad70b18489a7a1dffa545f5', 'mode': '100644'}, {'path': 'src/freedreno/vulkan/tu_knl_wddm.cc', 'sha': 'bc3d4ed7ac348ab7133c921c932b3e089adb9e25', 'mode': '100644'}, {'path': 'src/freedreno/vulkan/tu_knl_wddm.h', 'sha': '7af1950bc8ba806b524ab4cbee836eaeddb85512', 'mode': '100644'}, {'path': 'src/freedreno/vulkan/tu_wddm_lifetime.h', 'sha': '4a02e310bee1bcc8010139399b69b6e90addc5af', 'mode': '100644'}]
          encoded = (
            ''
            ''
            ''
          )
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/perf/droidvm-gpu-20260914'
          head = os.environ['GITHUB_SHA']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == head
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == base
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'turnip-lifetime.patch'
          patch.write_bytes(zlib.decompress(base64.b64decode(encoded, validate=True)))
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          entries = []
          for item in manifest:
              path = pathlib.Path(item['path'])
              assert '..' not in path.parts and not path.is_absolute()
              data = path.read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == item['sha'], str(path)
              entries.append(dict(path=str(path), mode=item['mode'], type='blob', content=data.decode('utf-8')))
          with open('turnip-materialization-tests.txt', 'w', encoding='utf-8') as log:
              for test in ['src/freedreno/vulkan/tests/check_tu_wddm_policy.py', 'src/freedreno/vulkan/tests/lifetime-perf/run.py']:
                  subprocess.run(['python3', test], stdout=log, stderr=subprocess.STDOUT, check=True)
          # Create verified Git objects only; the connector performs the ref update.
          def api(path, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/' + path, data=body,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          assert api('git/ref/heads/perf/droidvm-gpu-20260914')['object']['sha'] == head
          current = api('git/commits/' + head)
          entries.append(dict(path=cleanup, mode='100644', type='blob', sha=None))
          tree = api('git/trees', dict(base_tree=current['tree']['sha'], tree=entries))
          assert tree['sha'] == expected_tree, tree['sha']
          message = 'tu/wddm: defer retired BO destruction and reuse per-device submit scratch\n\nAdd opt-in bounded fence-qualified retirement with IOVA ownership retained on\nbusy, reset and failure. Keep AssumeNotInUse clear and the existing KMD range\narbitration. Reuse CPU staging under wddm_mutex and report aggregate reasons.\n\nAdd extracted production lifetime tests, 64 randomized schedules, 10000 Render\nstaging checks and four exact-failure negative controls. Keep default BO\nrelease behavior, private ABI and host-detach contracts unchanged. Remove the\none-shot materialization workflow; builds compile tracked C++ directly.\n\nSigned-off-by: Kancy Joe <54024877+sunflower2333@users.noreply.github.com>'
          commit = api('git/commits', dict(message=message, tree=tree['sha'], parents=[head]))
          pathlib.Path('turnip-perf-materialization.json').write_text(json.dumps(dict(repository=repo, base=base, parent=head, commit=commit['sha'], tree=tree['sha'], files=manifest, ref_updated=False), indent=2) + '\n', encoding='utf-8')
          print('Verified source tree', tree['sha'], 'created commit', commit['sha'], 'without changing any ref')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: turnip-perf-materialization-${{ github.sha }}
          path: |
            turnip-perf-materialization.json
            turnip-materialization-tests.txt
          retention-days: 7
          if-no-files-found: error
