name: Windows OpenGL ES Zink architecture candidates

on:
  workflow_dispatch:
  push:
    branches: [viogpu-opengl-arches-20260911, viogpu-opengl-integrated-20260911, viogpu-opengl-surface-20260911, work/egl-wgl-component-type-20260912]

permissions:
  contents: read
  actions: write

jobs:
  source-regressions:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate bounded render references and failed shader conversion
        shell: pwsh
        run: |
          python src/freedreno/vulkan/tests/tu_wddm_reference_test.py
          if ($LASTEXITCODE) { throw 'Render reference validation failed' }
          python src/freedreno/vulkan/tests/tu_compute_compile_failure_test.py
          if ($LASTEXITCODE) { throw 'Compute conversion failure regression failed' }
          python src/freedreno/vulkan/tests/tu_wddm_residency_test.py
          if ($LASTEXITCODE) { throw 'Turnip WDDM 2.0 residency regression failed' }
          python src/freedreno/vulkan/tests/check_tu_wddm_policy.py
          if ($LASTEXITCODE) { throw 'Turnip WDDM residency policy failed' }
  candidate:
    needs: source-regressions
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            msvc: x64_arm64
            triple: aarch64
            family: aarch64
            cmake: ARM64
          - arch: x64
            msvc: x64
            triple: x86_64
            family: x86_64
            cmake: x64
          - arch: x86
            msvc: x64_x86
            triple: i686
            family: x86
            cmake: Win32
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Loader
          ref: vulkan-sdk-1.4.304.0
          path: external/vulkan-loader
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: vulkan-sdk-1.4.304.0
          path: external/vulkan-headers
          fetch-depth: 1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - name: Cache compiled Mesa objects
        uses: ./.github/actions/compiler-cache
        with:
          architecture: ${{ matrix.arch }}
          flavor: opengl
      - uses: actions/setup-python@v5
        id: build_python
        with:
          python-version: '3.x'
      - name: Cache Python build downloads
        uses: actions/cache@v4
        with:
          path: '~\AppData\Local\pip\Cache'
          key: pip-gl-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-${{ steps.build_python.outputs.python-version }}-meson-1.9.1-mako-packaging-pyyaml-ninja
      - name: Cache checksum-pinned host shader compiler
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\glslang-downloads
          key: glslang-windows-x64-16.6.0-82bf434e69b9bb4829de7e2b4bc2c5e7a7861e53d66cf75e5cc70f5f694a8d9b
      - name: Install build generators
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check 'meson==1.9.1' mako packaging pyyaml ninja
          if ($LASTEXITCODE) { throw 'Python build tools failed' }
          choco install winflexbison3 --yes --no-progress
          if ($LASTEXITCODE) { throw 'WinFlexBison failed' }
          $flex = Get-ChildItem C:\ProgramData\chocolatey\lib -Recurse -Filter win_flex.exe | Select-Object -First 1
          if (!$flex) { throw 'Missing win_flex.exe' }
          Add-Content $env:GITHUB_PATH $flex.DirectoryName
          # Headers and the loader are separate pinned checkouts. Only a host
          # shader compiler is needed here; installing the full Vulkan SDK
          # added minutes and could stall its unattended installer.
          $version = '16.6.0'
          $digest = '82bf434e69b9bb4829de7e2b4bc2c5e7a7861e53d66cf75e5cc70f5f694a8d9b'
          $cache = Join-Path $env:RUNNER_TEMP 'glslang-downloads'
          New-Item -ItemType Directory -Force $cache | Out-Null
          $archive = Join-Path $cache 'glslang-16.6.0-windows-x86_64-release.zip'
          if (!(Test-Path -LiteralPath $archive)) {
            $url = "https://github.com/KhronosGroup/glslang/releases/download/$version/glslang-$version-windows-x86_64-release.zip"
            curl.exe --fail --location --retry 2 --connect-timeout 20 --max-time 120 --output $archive $url
            if ($LASTEXITCODE) { throw 'Host shader compiler download failed' }
          }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $digest) {
            throw 'Host shader compiler checksum mismatch'
          }
          $directory = Join-Path $env:RUNNER_TEMP 'glslang-host'
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $programs = @(Get-ChildItem -LiteralPath $directory -Recurse -File -Filter glslangValidator.exe)
          if ($programs.Count -eq 0) {
            $programs = @(Get-ChildItem -LiteralPath $directory -Recurse -File -Filter glslang.exe)
            if ($programs.Count -ne 1) { throw 'Expected one host shader compiler' }
            Copy-Item -LiteralPath $programs[0].FullName -Destination (Join-Path $programs[0].DirectoryName 'glslangValidator.exe')
            $programs = @(Get-ChildItem -LiteralPath $directory -Recurse -File -Filter glslangValidator.exe)
          }
          if ($programs.Count -ne 1) { throw 'Expected one glslangValidator.exe' }
          $shaderPath = $programs[0].FullName
          & $shaderPath --version
          if ($LASTEXITCODE) { throw 'Host shader compiler execution failed' }
          Add-Content $env:GITHUB_PATH (Split-Path -Parent $shaderPath)
      - name: Build architecture-matched Vulkan loader
        shell: pwsh
        run: |
          cmake -S external/vulkan-headers -B loader-headers -DCMAKE_INSTALL_PREFIX="$env:RUNNER_TEMP/vulkan-headers"
          if ($LASTEXITCODE) { throw 'Vulkan headers configuration failed' }
          cmake --install loader-headers
          if ($LASTEXITCODE) { throw 'Vulkan headers installation failed' }
          ./bin/configure-private-vulkan-loader.ps1 -Architecture '${{ matrix.arch }}' -Source external/vulkan-loader
          cmake -S external/vulkan-loader -B loader-build -A '${{ matrix.cmake }}' `
            -DVULKAN_HEADERS_INSTALL_DIR="$env:RUNNER_TEMP/vulkan-headers" `
            -DBUILD_TESTS=OFF -DUSE_MASM=OFF -DUSE_GAS=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE) { throw 'Vulkan loader configuration failed' }
          cmake --build loader-build --config Release --parallel
          if ($LASTEXITCODE) { throw 'Vulkan loader build failed' }
      - name: Build Zink WGL EGL GLES and Turnip
        shell: pwsh
        run: |
          # Meson keeps the cross-file compiler command for the host machine,
          # while GitHub's MSVC environment can provide CC/CXX for build-machine
          # probes. Set both explicitly so every clang-cl translation unit goes
          # through sccache, including the host cross build.
          $env:CC = 'sccache clang-cl'
          $env:CXX = 'sccache clang-cl'
          $cross = Join-Path $env:RUNNER_TEMP opengl-cross.ini
          @(
            '[binaries]'
            "c = ['sccache', 'clang-cl', '--target=${{ matrix.triple }}-pc-windows-msvc']"
            "cpp = ['sccache', 'clang-cl', '--target=${{ matrix.triple }}-pc-windows-msvc']"
            "ar = 'llvm-lib'"
            '[host_machine]'
            "system = 'windows'"
            "cpu_family = '${{ matrix.family }}'"
            "cpu = '${{ matrix.family }}'"
            "endian = 'little'"
            '[properties]'
            'needs_exe_wrapper = true'
            '[built-in options]'
            "c_link_args = ['/DEBUG']"
            "cpp_link_args = ['/DEBUG']"
          ) | Set-Content $cross -Encoding ascii
          meson setup gl-build . --cross-file $cross --backend=ninja `
            --buildtype=debugoptimized -Doptimization=3 -Db_ndebug=true `
            -Dplatforms=windows -Dvulkan-drivers=freedreno -Dfreedreno-kmds=wddm `
            -Dgallium-drivers=zink -Dopengl=true -Dgles1=enabled -Dgles2=enabled `
            -Degl=enabled -Dglx=disabled -Dgbm=disabled -Dllvm=disabled `
            -Dshader-cache=disabled -Dzlib=enabled -Dzlib:default_library=static -Dzstd=disabled `
            -Dwindows-private-gl-arch='${{ matrix.arch }}' `
            -Db_vscrt=static_from_buildtype '-Dtools=[]' -Dbuild-tests=false -Dwerror=false
          if ($LASTEXITCODE) { throw 'OpenGL Meson configuration failed' }
          # Validate the actual generated compiler configuration, not only the
          # requested platform list. A surfaceless default rejects every HWND.
          if (!(Select-String -LiteralPath gl-build/build.ninja -SimpleMatch -Pattern '_EGL_NATIVE_PLATFORM=_EGL_PLATFORM_WINDOWS' -Quiet)) {
            throw 'EGL_DEFAULT_DISPLAY does not select the native Windows platform'
          }
          meson compile -C gl-build
          if ($LASTEXITCODE) { throw 'OpenGL compile/link failed' }
      - name: Stage and validate complete candidate
        shell: pwsh
        run: |
          ./bin/stage-windows-opengl.ps1 -Architecture '${{ matrix.arch }}' -Build gl-build -LoaderBuild loader-build -Stage opengl-candidate
          if ($LASTEXITCODE) { throw 'Candidate validation failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: opengl-zink-${{ matrix.arch }}-candidate
          path: opengl-candidate
          if-no-files-found: error
          retention-days: 7
